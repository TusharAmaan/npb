<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>NPB Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect directly into HashRouter format
      var l = window.location;
      var pathParts = l.pathname.split('/').filter(Boolean);
      var isProjectPage = l.hostname.endsWith('github.io') && pathParts.length > 0;
      var repoPrefix = isProjectPage ? '/' + pathParts[0] : '';
      var routeParts = isProjectPage ? pathParts.slice(1) : pathParts;
      var route = routeParts.join('/');

      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPrefix + '/#/' + route + (l.search || '') + l.hash;
      l.replace(target);
    </script>
  </head>
  <body>
    Redirecting to NPB...
  </body>
</html>
